[package]
name = "ndp-publish-gui"
version = "0.3.0"
edition = "2021"
description = "Publisher GUI - ドラッグ＆ドロップで楽曲情報を publish する Tauri アプリ"

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
name = "app_lib"

[dependencies]
base64 = "0.22"
ndp-publish = { path = "../../publisher" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shellexpand = "3"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
