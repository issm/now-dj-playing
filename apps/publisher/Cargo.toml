[package]
name = "ndp-publish"
version = "0.1.0"
edition = "2021"
description = "楽曲ファイルからタグ・アートワークを抽出し、共有ディレクトリに出力する CLI ツール"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
id3 = "1.13"
mp4ameta = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
