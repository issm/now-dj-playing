# fail2ban filter: ndp-server 向け不正リクエスト検出
#
# Caddy の JSON アクセスログから、既知の攻撃パターンを検出する。
# Caddy のログは JSON 形式のため、各フィールドを正規表現でマッチさせる。
#
# 検出対象:
#   - 脆弱性スキャン系パス（.env, wp-admin, phpmyadmin, etc.）
#   - 存在しないパスへの連続アクセス（404 レスポンス）
#
# 配置先: /etc/fail2ban/filter.d/caddy-ndp.conf

[Definition]

# Caddy JSON ログの日付フォーマット（Unix epoch float）
datepattern = "ts":{EPOCH}

# 既知の攻撃パターンへのアクセス（ステータスコード不問で即検出）
failregex = ^.*"remote_ip":"<HOST>".*"uri":"/(\.env|\.git|wp-admin|wp-login|wp-content|wp-includes|administrator|phpmyadmin|phpMyAdmin|pma|admin|cgi-bin|config|backup|shell|eval|setup|install|xmlrpc\.php|actuator|api/v1/pods|boaform|owa|autodiscover|\.well-known/security\.txt|telescope/requests).*$
            ^.*"remote_ip":"<HOST>".*"status":(404|403).*$

ignoreregex =
