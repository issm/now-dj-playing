[package]
name = "watch-core"
version = "0.2.0"
edition = "2021"
description = "Core file watching and parsing logic for now-dj-playing"

[[example]]
name = "watch_local"
path = "examples/watch_local.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.11"
log = "0.4"
notify = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
