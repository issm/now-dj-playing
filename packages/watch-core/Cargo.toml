[package]
name = "watch-core"
version = "0.1.0"
edition = "2021"
description = "Core file watching and parsing logic for now-dj-playing"

[dependencies]
notify = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"

[[example]]
name = "watch_local"
path = "examples/watch_local.rs"
